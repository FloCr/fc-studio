<!doctype html>
<!-- Modèle de l'image de partage (1200×630) : capture Chrome headless
     enregistrée dans src/assets/img/og-image.jpg -->
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Manrope"; font-weight: 400 800; src: url("../src/assets/fonts/manrope-latin.woff2") format("woff2"); }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #f8fafc; color: #0f172a; font-family: "Manrope", sans-serif; position: relative; }
  .copy { position: absolute; left: 72px; top: 64px; width: 560px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .mark { width: 56px; height: 56px; }
  .brand b { display: block; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
  .brand span { display: block; font-size: 17px; font-weight: 500; color: #64748b; }
  h1 { margin-top: 56px; font-size: 60px; line-height: 1.05; letter-spacing: -0.045em; font-weight: 800; }
  .price { margin-top: 32px; font-size: 24px; font-weight: 600; color: #475569; }
  .price strong { font-size: 52px; font-weight: 800; letter-spacing: -0.04em; color: #2563eb; margin-left: 6px; }
  .browser { position: absolute; left: 690px; top: 110px; width: 620px; border-radius: 12px; overflow: hidden; background: #fff; border: 1px solid #e2e8f0; box-shadow: 0 30px 60px -28px rgb(15 23 42 / .35); }
  .bar { height: 34px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; gap: 7px; align-items: center; padding-left: 14px; }
  .bar i { width: 10px; height: 10px; border-radius: 50%; background: #e2e8f0; }
  .browser img { display: block; width: 100%; aspect-ratio: 16/10; object-fit: cover; object-position: top; }
  .phone { position: absolute; left: 640px; top: 300px; width: 170px; border: 6px solid #0f172a; border-radius: 28px; overflow: hidden; background: #0f172a; box-shadow: 0 30px 60px -20px rgb(15 23 42 / .45); }
  .phone img { display: block; width: 100%; border-radius: 21px; aspect-ratio: 390/760; object-fit: cover; object-position: top; }
  .badge { position: absolute; display: flex; align-items: center; gap: 10px; padding: 12px 18px 12px 12px; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 12px 32px -16px rgb(15 23 42 / .3); font-size: 19px; font-weight: 700; }
  .badge i { width: 26px; height: 26px; border-radius: 50%; background: #22c55e; display: grid; place-items: center; }
  .badge svg { width: 15px; height: 15px; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><rect width="48" height="48" rx="12" fill="#0f172a"/><path fill="#f8fafc" d="M8.5 14h10v4.6h-5V22h6.5v4.4h-6.5V34h-5z"/><path d="M35.5 18.6a7 7 0 1 0 0 10.8" fill="none" stroke="#f8fafc" stroke-width="4.6"/><circle cx="40" cy="31.6" r="2.7" fill="#22c55e"/></svg><div><b>Florian Carrière</b><span>Studio web</span></div></div>
    <h1>Création de sites web modernes, rapides et efficaces.</h1>
    <p class="price">À partir de <strong>200 €</strong></p>
  </div>
  <div class="browser"><div class="bar"><i></i><i></i><i></i></div><img src="../src/assets/img/realisations/crea-desktop-960.webp" alt=""></div>
  <div class="phone"><img src="../src/assets/img/realisations/mathieu-mobile-390.webp" alt=""></div>
  <div class="badge" style="left: 960px; top: 70px"><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></i>Responsive</div>
  <div class="badge" style="left: 900px; top: 520px"><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></i>Optimisé pour Google</div>
</body>
</html>
